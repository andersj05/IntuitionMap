id: EXP-P2-002
date: 2026-07-28
research_question: >
  Does a dependency-free local embedding channel add complementary evidence to
  the strongest cheap lexical and recency rankers?
hypothesis: >
  Reciprocal-rank fusion of BM25, deterministic hashed token-and-bigram
  embeddings, and
  recency will improve LongMemEval-S macro evidence recall at 10 by at least
  five percentage points absolute or ten percent relative over BM25 alone,
  with a paired 95 percent interval excluding zero.
decision_this_can_change: >
  Whether the local embedding and hybrid channels enter the generic candidate
  baseline or are retained only as negative/diagnostic controls.
dataset_versions_and_hashes:
  longmemeval_s:
    revision: 98d7416c24c778c2fee6e6f3006e7a073259d48f
    artifact: longmemeval_s_cleaned.json
    sha256: d6f21ea9d60a0d56f34a05b609c79c88a451d2ae03597821ea3d5a9678c3a442
  intuition_map_smoke:
    fingerprint: 7eb86af0562b26b546b99810817f4f44eda52615fc0992a8369fcfcba30d4418
train_dev_test_time_boundaries: >
  Same 470 immutable, officially retrieval-scored native queries and timestamp
  audit as EXP-P2-001; no fitting, tuning, or threshold selection from labels.
intervention:
  embedding:
    type: deterministic hashed token-and-bigram vector
    dimensions: 512
    seed: 1729
  fusion:
    type: reciprocal rank fusion
    rrf_k: 60
    channels:
      - bm25
      - local_embedding
      - recency
strongest_comparable_baseline: BM25 from EXP-P2-001 at identical information access
information_available_to_each_system: >
  Exactly the native question and eligible prior sessions. Hashing uses only
  each text and a fixed public seed; fusion uses ranks, never gold labels.
primary_metric: macro evidence-session recall at 10 on LongMemEval-S
secondary_metrics:
  - evidence recall and hit rate at 1, 3, 5, and 10
  - mean reciprocal rank
  - binary nDCG at 10
  - latency and serialized index size
  - IntuitionMap smoke known-invalid exposure
practical_minimum_effect: >
  Five percentage points absolute or ten percent relative recall-at-10 gain
  over BM25.
statistical_test_and_interval: >
  Paired query-level bootstrap with 2,000 resamples, seed 1729, and a
  percentile 95 percent interval for the recall-at-10 delta.
invalid_exposure_tolerance: >
  No increase greater than 0.10 known-invalid predictions per judged smoke
  query at k=5 over BM25.
latency_token_and_cost_budget:
  max_wall_seconds_per_method: 300
  paid_api_requests: 0
  max_cost_usd: 0
privacy_risks: >
  Public benchmark text stays local and ignored. No user data or hosted model
  service is used.
expected_failure_modes:
  - hashing behaves like a noisy lexical method rather than semantics
  - long sessions dilute sparse evidence
  - rank fusion sacrifices top-rank precision for coverage
  - a hybrid gain is benchmark-specific and does not establish personal fidelity
stop_go_rule: >
  Accept a channel only if it passes the preregistered effect and interval
  against BM25 without violating the smoke invalid-exposure tolerance.
  Otherwise retain the result as a negative ablation and freeze BM25.
